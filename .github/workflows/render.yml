name: Monta video

on:
  push:
    paths:
      - "jobs/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa ffmpeg, font e voce
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install edge-tts

      - name: Monta i video mancanti
        run: |
          mkdir -p out
          set -o pipefail
          python render.py 2>&1 | tee out/render.log

      - name: Salva i video e il registro nel repository
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "Nessun nuovo video."
          else
            git commit -m "Nuovo video montato"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
